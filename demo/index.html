<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI | Legal Assistant Demo</title>
    <!-- Add marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-width: 260px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Auth UI */
        .auth-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--background);
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .auth-container h1 { text-align: center; color: var(--primary); margin-bottom: 0.5rem; }
        .auth-container .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .auth-form input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
        .auth-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .auth-form button { padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
        
        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #fecaca;
        }

        /* App Layout */
        #appSection { display: none; width: 100%; height: 100%; }
        
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: white; }
        .new-chat-btn {
            width: calc(100% - 40px);
            margin: 20px;
            padding: 12px;
            background: transparent;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .new-chat-btn:hover { background: #334155; }
        
        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }
        .conv-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .conv-item:hover { background: #334155; }
        .conv-item.active { background: #334155; color: white; font-weight: 500; }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid #334155;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .logout-btn { color: #93c5fd; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; }

        /* Main Chat Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--background);
        }
        .chat-header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-main);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message {
            max-width: 80%;
            padding: 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: white;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            width: 100%;
        }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 { margin-top: 1rem; margin-bottom: 0.5rem; }
        .message.assistant p { margin-top: 0; margin-bottom: 1rem; }
        
        /* Citations inside message */
        .citations {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .citation-item { margin-bottom: 8px; color: var(--text-muted); }
        .citation-title { font-weight: 600; color: var(--text-main); }
        
        /* Input Area */
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid var(--border);
        }
        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }
        .input-container input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .input-container input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
        .input-container button {
            padding: 0 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .input-container button:disabled { background: #93c5fd; cursor: not-allowed; }

        .loading-indicator {
            align-self: flex-start;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .spinner {
            border: 2px solid rgba(0,0,0,0.1);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
    </style>
</head>
<body>

    <!-- AUTH SECTION -->
    <div id="authSection" class="auth-wrapper">
        <div class="auth-container">
            <h1>⚖️ LexAI</h1>
            <div class="subtitle">Agentic Legal Research</div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
                <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</div>
            </div>
            
            <div id="loginForm" class="auth-form">
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="login()">Login</button>
            </div>

            <div id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regUsername" placeholder="Username">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPassword" placeholder="Password">
                <button onclick="register()">Register</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>⚖️ LexAI</h2>
            </div>
            <button class="new-chat-btn" onclick="startNewConversation()">+ New Conversation</button>
            <div class="conv-list" id="conversationList">
                <!-- Convs populated here -->
            </div>
            <div class="sidebar-footer">
                <span id="loggedInUser"></span> | <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-area">
            <div class="chat-header" id="chatHeader">New Conversation</div>
            
            <div class="chat-messages" id="chatMessages">
                <!-- Messages populated here -->
                <div class="message assistant">
                    Hello! I am LexAI, your legal research assistant. How can I help you today?
                </div>
                
                <div class="loading-indicator" id="loadingIndicator">
                    <div class="spinner"></div> Synthesizing...
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="queryInput" placeholder="e.g. What is the punishment for theft in Pakistan?" onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentConversationId = null;

        window.onload = async function() {
            const token = localStorage.getItem('lexai_token');
            if (token) {
                try {
                    const res = await fetch('http://localhost:8000/api/v1/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const user = await res.json();
                        document.getElementById('loggedInUser').innerText = user.username;
                        showAppSection();
                        await loadConversations();
                    } else {
                        logout();
                    }
                } catch (e) {
                    logout();
                }
            }
        };

        function showAppSection() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'flex';
        }

        function switchAuthTab(tab) {
            document.getElementById('errorMessage').style.display = 'none';
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'flex';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').style.display = 'flex';
                document.getElementById('loginForm').style.display = 'none';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.innerText = msg;
            el.style.display = 'block';
        }

        async function authRequest(url, method, body, isUrlEncoded = false) {
            const headers = isUrlEncoded ? 
                { 'Content-Type': 'application/x-www-form-urlencoded' } : 
                { 'Content-Type': 'application/json' };
                
            return fetch(url, { method, headers, body });
        }

        async function register() {
            const u = document.getElementById('regUsername').value.trim();
            const e = document.getElementById('regEmail').value.trim();
            const p = document.getElementById('regPassword').value;
            if (!u || !e || !p) return showError('All fields required');

            const res = await authRequest('http://localhost:8000/api/v1/auth/register', 'POST', JSON.stringify({ username: u, email: e, password: p }));
            if (res.ok) {
                alert('Registration successful! Please login.');
                switchAuthTab('login');
                document.getElementById('loginUsername').value = u;
            } else {
                const data = await res.json();
                showError(data.detail || 'Registration failed');
            }
        }

        async function login() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;
            if (!u || !p) return showError('Username and password required');

            const params = new URLSearchParams();
            params.append('username', u);
            params.append('password', p);

            const res = await authRequest('http://localhost:8000/api/v1/auth/token', 'POST', params, true);
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('lexai_token', data.access_token);
                document.getElementById('loggedInUser').innerText = u;
                showAppSection();
                await loadConversations();
            } else {
                showError('Login failed');
            }
        }

        function logout() {
            localStorage.removeItem('lexai_token');
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('appSection').style.display = 'none';
            currentConversationId = null;
        }

        // --- Conversation Management ---

        async function apiCall(endpoint, method = 'GET', body = null) {
            const token = localStorage.getItem('lexai_token');
            const options = {
                method,
                headers: { 'Authorization': 'Bearer ' + token }
            };
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            const res = await fetch('http://localhost:8000' + endpoint, options);
            if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
            return res;
        }

        async function loadConversations() {
            const res = await apiCall('/api/v1/conversations');
            if (res.ok) {
                const convs = await res.json();
                const list = document.getElementById('conversationList');
                list.innerHTML = '';
                convs.forEach(c => {
                    const div = document.createElement('div');
                    div.className = `conv-item ${c.id === currentConversationId ? 'active' : ''}`;
                    div.innerText = c.title || 'New Conversation';
                    div.onclick = () => selectConversation(c.id);
                    list.appendChild(div);
                });
            }
        }

        async function startNewConversation() {
            currentConversationId = null;
            document.getElementById('chatHeader').innerText = 'New Conversation';
            document.getElementById('chatMessages').innerHTML = `
                <div class="message assistant">Hello! I am LexAI, your legal research assistant. How can I help you today?</div>
                <div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div> Synthesizing...</div>
            `;
            await loadConversations(); // refresh active state
        }

        async function selectConversation(id) {
            currentConversationId = id;
            await loadConversations(); // update active class
            
            const res = await apiCall(`/api/v1/conversations/${id}`);
            if (res.ok) {
                const conv = await res.json();
                document.getElementById('chatHeader').innerText = conv.title;
                
                const msgsContainer = document.getElementById('chatMessages');
                msgsContainer.innerHTML = '';
                
                conv.messages.forEach(m => {
                    appendMessage(m.role, m.content, m.metadata);
                });
                
                // Add loading indicator back at bottom
                msgsContainer.innerHTML += `<div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div> Synthesizing...</div>`;
                scrollToBottom();
            }
        }

        function appendMessage(role, content, metadata = {}) {
            const msgsContainer = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'user') {
                div.innerText = content;
            } else {
                // Assistant message uses markdown
                let html = marked.parse(content || "No answer generated.");
                
                if (metadata && metadata.citations && metadata.citations.length > 0) {
                    html += `<div class="citations"><strong>Citations:</strong>`;
                    metadata.citations.forEach(c => {
                        html += `<div class="citation-item"><span class="citation-title">${c.title}</span> - ${c.source}</div>`;
                    });
                    html += `</div>`;
                }
                
                div.innerHTML = html;
            }
            
            // Insert before loading indicator
            const loading = document.getElementById('loadingIndicator');
            msgsContainer.insertBefore(div, loading);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query) return;

            input.value = '';
            appendMessage('user', query);
            
            const btn = document.getElementById('sendBtn');
            const loading = document.getElementById('loadingIndicator');
            btn.disabled = true;
            loading.style.display = 'flex';
            scrollToBottom();

            try {
                // Create conversation if it doesn't exist
                if (!currentConversationId) {
                    const res = await apiCall('/api/v1/conversations', 'POST', { title: query.substring(0, 50) });
                    const conv = await res.json();
                    currentConversationId = conv.id;
                    document.getElementById('chatHeader').innerText = conv.title;
                }

                // Stream response
                const token = localStorage.getItem('lexai_token');
                const url = `http://localhost:8000/api/v1/conversations/${currentConversationId}/stream?query=${encodeURIComponent(query)}`;
                
                const response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                
                // Temporary message container for streaming
                const msgsContainer = document.getElementById('chatMessages');
                const streamDiv = document.createElement('div');
                streamDiv.className = 'message assistant';
                msgsContainer.insertBefore(streamDiv, loading);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    let boundary = buffer.indexOf('\n');
                    
                    while (boundary !== -1) {
                        let line = buffer.slice(0, boundary).trim();
                        buffer = buffer.slice(boundary + 1);
                        
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.event_type === 'thought') {
                                    // Could show thought process somewhere if desired
                                } else if (data.event_type === 'result') {
                                    const finalData = JSON.parse(data.data);
                                    
                                    // Typewriter effect
                                    let html = marked.parse(finalData.answer || "");
                                    if (finalData.citations && finalData.citations.length > 0) {
                                        html += `<div class="citations"><strong>Citations:</strong>`;
                                        finalData.citations.forEach(c => {
                                            html += `<div class="citation-item"><span class="citation-title">${c.title}</span> - ${c.source}</div>`;
                                        });
                                        html += `</div>`;
                                    }
                                    
                                    streamDiv.innerHTML = "";
                                    let i = 0;
                                    const speed = 10; // ms per char
                                    function typeWriter() {
                                        if (i < html.length) {
                                            // Quick hack for HTML tags so they don't render broken text
                                            if (html.charAt(i) === '<') {
                                                let tag = '';
                                                while (html.charAt(i) !== '>' && i < html.length) {
                                                    tag += html.charAt(i);
                                                    i++;
                                                }
                                                tag += '>';
                                                streamDiv.innerHTML += tag;
                                                i++;
                                            } else {
                                                streamDiv.innerHTML += html.charAt(i);
                                                i++;
                                            }
                                            scrollToBottom();
                                            setTimeout(typeWriter, speed);
                                        }
                                    }
                                    typeWriter();
                                }
                            } catch (e) {}
                        }
                        boundary = buffer.indexOf('\n');
                    }
                }
                
                await loadConversations(); // update titles if it auto-titled
            } catch (err) {
                console.error(err);
                alert("Error sending message");
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
                scrollToBottom();
            }
        }
    </script>
</body>
</html>
