<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI | Legal Assistant Demo</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            padding: 14px 28px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-weight: 500;
        }
        .spinner {
            border: 3px solid rgba(0,0,0,0.1);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .badge.low-confidence {
            background: #fee2e2;
            color: #991b1b;
        }
        .answer {
            white-space: pre-wrap;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .citations {
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .citations h3 {
            font-size: 16px;
            margin-top: 0;
            color: var(--text-muted);
        }
        .citation-item {
            background: var(--background);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .citation-title {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }
        .citation-source {
            font-size: 13px;
            color: var(--text-muted);
        }
        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <h1>⚖️ LexAI</h1>
    <div class="subtitle">Agentic Legal Research Assistant</div>
    
    <div class="error-message" id="errorMessage"></div>

    <div class="search-box">
        <input type="text" id="queryInput" placeholder="e.g. What is the punishment for theft in Pakistan?" onkeypress="if(event.key === 'Enter') research()">
        <button id="searchBtn" onclick="research()">Research</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div> Synthesizing legal answer...
    </div>

    <div class="result-card" id="resultCard">
        <div class="badge" id="confidenceBadge">Confidence: 0%</div>
        <div class="answer" id="answerText"></div>
        <div class="citations">
            <h3>Sources & Citations</h3>
            <div id="citationsList"></div>
        </div>
    </div>

    <script>
        async function research() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) return;

            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMessage');

            // Reset UI state
            btn.disabled = true;
            loading.style.display = 'block';
            resultCard.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                // Ensure your LexAI API is running on localhost:8000
                const response = await fetch('http://localhost:8000/api/v1/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Hardcoded token/key for local demo purposes
                        'Authorization': 'Bearer demo-api-key' 
                    },
                    body: JSON.stringify({
                        query: query,
                        jurisdiction: 'Pakistan'
                    })
                });

                if (!response.ok) {
                    throw new Error(`API returned status: ${response.status}`);
                }

                const data = await response.json();
                
                // Set Confidence Badge
                const confidence = data.confidence_score * 100;
                const badge = document.getElementById('confidenceBadge');
                badge.innerText = `Confidence: ${confidence.toFixed(0)}%`;
                if (confidence < 60) {
                    badge.classList.add('low-confidence');
                } else {
                    badge.classList.remove('low-confidence');
                }

                // Set Answer Text
                document.getElementById('answerText').innerText = data.answer || "No answer generated.";
                
                // Populate Citations
                let citationsHtml = '';
                if (data.citations && data.citations.length > 0) {
                    data.citations.forEach((c, idx) => {
                        const title = c.title || `Source [${idx + 1}]`;
                        const source = c.source || "Unknown Context";
                        const score = c.score ? `(Score: ${c.score.toFixed(2)})` : "";
                        
                        citationsHtml += `
                            <div class="citation-item">
                                <div class="citation-title">${title} ${score}</div>
                                <div class="citation-source">${source}</div>
                            </div>
                        `;
                    });
                } else {
                    citationsHtml = '<div class="citation-item"><div class="citation-source">No specific citations retrieved.</div></div>';
                }
                document.getElementById('citationsList').innerHTML = citationsHtml;

                // Show Results
                resultCard.style.display = 'block';
            } catch (error) {
                console.error("Fetch error:", error);
                errorMsg.innerText = 'Error connecting to API. Make sure your Docker container is running on port 8000.';
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
